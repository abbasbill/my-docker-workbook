id: 09_gcp_taxi_scheduled_forEach
namespace: zoomcamp
description: |
  Refactored to use ForEach over year-month and taxi-type combinations with Subflow.
  Best to add a label `backfill:true` from the UI to track executions created via a backfill.
  CSV data used here comes from: https://github.com/DataTalksClub/nyc-tlc-data/releases

inputs:
  - id: year_months
    type: ARRAY
    displayName: Year-Month combinations (YYYY-MM format)
    defaults: ["2024-01", "2024-02", "2024-03"]
  
  - id: taxi_types
    type: ARRAY
    displayName: Taxi types to process
    defaults: ["yellow", "green"]

tasks:
  - id: generate_combinations
    type: io.kestra.plugin.core.flow.ForEach
    values: |
      {% set combinations = [] %}
      {% for year_month in inputs.year_months %}
        {% for taxi in inputs.taxi_types %}
          {% set _ = combinations.append({'year_month': year_month, 'taxi': taxi}) %}
        {% endfor %}
      {% endfor %}
      {{ combinations }}
    tasks:
      - id: process_combination
        type: io.kestra.plugin.core.flow.Subflow
        namespace: zoomcamp
        flowId: 09_gcp_taxi_processing_subflow
        inputs:
          taxi: "{{taskrun.value.taxi}}"
          year_month: "{{taskrun.value.year_month}}"
        wait: true
        transmitFailed: true

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"

triggers:
  - id: monthly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 1 * *"
    inputs:
      year_months: ["{{trigger.date | date('yyyy-MM')}}"]
      taxi_types: ["yellow", "green"]